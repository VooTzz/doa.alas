<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maintance — ReactTelegram</title>
  <style>
    :root{
      --bg1: linear-gradient(135deg,#0f1724,#0b3b5c);
      --card: rgba(255,255,255,0.06);
      --accent: #ff6b6b;
      --muted: rgba(255,255,255,0.75);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg1);
      color:white;
    }
    .card{
      width:90%;
      max-width:720px;
      text-align:center;
      padding:40px 28px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      box-shadow: 0 12px 40px rgba(2,6,23,0.7);
      border: 1px solid rgba(255,255,255,0.04);
      transform: translateY(0);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float{
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    .big{
      font-size:48px;
      font-weight:700;
      letter-spacing:1px;
      margin:0 0 12px;
      color: #fff;
      text-transform: lowercase;
    }
    .sub{
      font-size:20px;
      margin:0;
      color: var(--muted);
      display:block;
      margin-bottom:18px;
    }
    .open-date{
      display:inline-block;
      margin-top:18px;
      padding:10px 18px;
      border-radius:10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      font-weight:600;
      color: #ffdede;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .note{font-size:13px;color:rgba(255,255,255,0.5);margin-top:14px}
    @media (max-width:520px){
      .big{font-size:34px}
      .sub{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="big">maintance</div>
    <div class="sub">open 28 septmber 2025</div>
    <div class="open-date">🗓 28 septmber 2025</div>
    <p class="note">Terima kasih atas kesabaranmu — ReactTelegram akan kembali online pada tanggal di atas.</p>
  </div>
</body>
</html>
